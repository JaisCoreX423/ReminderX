name: Android

# Builds the APK on every push that touches android/ (to catch compile errors) and on demand.
# Release builds are signed in release.yml.
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: gradle -p android assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ReminderX-apk
          path: android/app/build/outputs/apk/release/*.apk
