name: Release

# Push a version tag (e.g. `git tag v1.1.0 && git push origin v1.1.0`) to build the Windows
# installer and the Android APK and publish both as one GitHub release. Installed copies of
# ReminderX (Windows and Android) pick it up automatically.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # The same signing key every release, or Android refuses to install the update over the old app.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p android assembleRelease -PappVersion="${{ github.ref_name }}"
          cp android/app/build/outputs/apk/release/app-release.apk ReminderX.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ReminderX.apk

  release:
    needs: apk
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build installer
        shell: pwsh
        run: ./build-installer.ps1 -Version "${{ github.ref_name }}"

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/ReminderXSetup.exe dist/ReminderX.apk `
            --title "ReminderX ${{ github.ref_name }}" --generate-notes
