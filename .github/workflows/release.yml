name: Release

# Push a version tag (e.g. `git tag v1.0.2 && git push origin v1.0.2`) to build the installer
# and publish it as a GitHub release. Installed copies of ReminderX pick it up automatically.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build installer
        shell: pwsh
        run: ./build-installer.ps1 -Version "${{ github.ref_name }}"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/ReminderXSetup.exe `
            --title "ReminderX ${{ github.ref_name }}" --generate-notes
