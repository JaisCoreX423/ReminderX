<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReminderX Sync</title>
  <style>
    :root { --bg: #f5f5f7; --fg: #1d1d1f; --muted: #6e6e73; --card: #fff; --ok: #34c759; --bad: #ff3b30; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000; --fg: #f5f5f7; --muted: #98989d; --card: #1c1c1e; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 15px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
    main { background: var(--card); border-radius: 18px; padding: 28px 32px; max-width: 420px; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p { color: var(--muted); margin: 0 0 14px; }
    #status::before { content: "●"; margin-right: 6px; color: var(--muted); }
    #status.ok::before { color: var(--ok); }
    #status.bad::before { color: var(--bad); }
  </style>
</head>
<body>
  <main>
    <h1>ReminderX Sync</h1>
    <p>Keeps ReminderX on Windows and Android in sync. Reminders travel end-to-end encrypted; this service never sees their content.</p>
    <div id="status">Checking…</div>
  </main>
  <script>
    fetch("/api/health").then(r => r.json().then(b => [r.ok, b])).then(([ok, b]) => {
      const el = document.getElementById("status");
      el.className = ok ? "ok" : "bad";
      el.textContent = ok ? `Running (${b.storage})` : (b.error || "Not available");
    }).catch(() => { const el = document.getElementById("status"); el.className = "bad"; el.textContent = "Not available"; });
  </script>
</body>
</html>
